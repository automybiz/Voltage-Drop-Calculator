<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltage Drop Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg-color: #011;
            --text-color: #fff;
            --table-border: #0ff;
            --table-header-bg-color: #022;
            --table-row-bg-color: #201;
            --input-bg: #111;
            --highlight: #0ff;
            
            /* Accordion Variables */
            --question-bg-color: #022;
            --question-border-color: #099;
            --question-hover-bg-color: #033;
            --answer-bg-color: #000;
            --border-radius: 8px;
            --accordion-spacing: 10px;
            --panel-bg-color: #201;
            --capacity-ok: #4F4;
            --capacity-over: #F44;

            /* Button Variables */
            --button-text-color: #FFF;
            --button-bg-color: #033;
            --button-svg-color: #0FF;
            --button-border-color: #0FF;
            --button-hover-bg-color: #066;

            /* Input Variables */
            --input-text-color: #FFF;
            --input-bg-color: #011;
            --input-border-color: #0FF;
            --input-placeholder-text-color: #999;

            /* Safety Result Colors */
            --safety-excellent: #4AF;
            --safety-safe: #4F4;
            --safety-warning: #FA0;
            --safety-danger: #F44;
        }

        body {
            font-family: 'Segoe UI', "Arial Narrow", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: var(--highlight);
            text-align: center;
        }

        .container {
            width: 95%;
            max-width: none;
        }

        /* Accordion Styles */
        .accordion-container {
            margin-bottom: 20px;
            border: 1px solid var(--question-border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            width: 100%;
        }

        .accordion-header {
            background-color: var(--question-bg-color);
            color: #fff;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--question-border-color);
            transition: background-color 0.2s;
        }

        .accordion-header:hover {
            background-color: var(--question-hover-bg-color);
        }

        .accordion-header h3 {
            margin: 0;
            color: var(--highlight);
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .accordion-content {
            background-color: var(--panel-bg-color);
            padding: 15px;
            display: block; /* Shown by default based on screenshot */
            position: relative;
        }

        .accordion-content.closed {
            display: none;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
        }

        .setting-item label {
            margin-bottom: 5px;
            color: var(--highlight);
            font-size: 0.9em;
            font-weight: bold;
        }

        /* Visibility Grid */
        .visibility-split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .visibility-controls {
            /* Now managed by parent split-container */
        }

        .visibility-header {
            color: var(--highlight);
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .visibility-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .visibility-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 0.9em;
        }

        .visibility-item span {
            cursor: pointer;
        }

        .visibility-item span:hover {
            color: var(--highlight);
        }

        .visibility-item input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: var(--highlight);
        }

        .drag-handle {
            cursor: grab;
            padding-right: 5px;
            color: var(--highlight);
            user-select: none;
            font-size: 1.2em;
        }

        .visibility-item.dragging {
            opacity: 0.4;
            background-color: rgba(0, 255, 255, 0.1);
        }

        .visibility-item.drag-over {
            border-top: 2px solid var(--highlight);
            margin-top: -2px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background-color: var(--button-bg-color);
            color: var(--button-text-color);
            border: 1px solid var(--button-border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--button-hover-bg-color);
            box-shadow: 0 0 5px var(--highlight);
        }

        .btn-add { }
        .btn-edit { }
        .btn-delete { border-color: #f44; }
        .btn-delete:hover { background-color: #660000; box-shadow: 0 0 5px #f44; }

        .import-export-container {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border: 1px solid var(--table-border);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        th, td {
            border-right: 1px solid #044;
            border-bottom: 1px solid #044;
            padding: 12px 8px;
            text-align: center;
            white-space: nowrap;
        }

        .product-name-cell {
            white-space: normal !important;
            padding-right: 8px !important; /* Resetting padding to match others */
        }

        .external-link-icon {
            float: right;
            margin-top: 2px;
            margin-left: 10px;
            color: var(--highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .external-link-icon:hover {
            transform: scale(1.2);
            color: #fff;
        }

        .notes-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        th {
            background-color: var(--table-header-bg-color);
            color: var(--highlight);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        td {
            background-color: var(--table-row-bg-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .cord-setup-cell {
            font-weight: bold;
            color: #fff;
        }

        .total-length {
            font-size: 0.85em;
            color: #888;
            display: block;
            margin-top: 4px;
        }

        /* Safety Classes */
        .excellent { color: var(--safety-excellent); font-weight: bold; }
        .safe { color: var(--safety-safe); font-weight: bold; }
        .warning { color: var(--safety-warning); font-weight: bold; }
        .danger { color: var(--safety-danger); font-weight: bold; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #002222;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--highlight);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            position: relative;
        }

        .close-modal {
            color: #AAA;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close-modal:hover { color: #fff; }

        .modal-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .full-width { grid-column: span 2; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            color: var(--highlight);
            font-weight: bold;
            font-size: 0.9em;
        }

        input, select, textarea {
            background-color: var(--input-bg-color);
            color: var(--input-text-color);
            border: 1px solid var(--input-border-color);
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
        }

        input::placeholder, textarea::placeholder {
            color: var(--input-placeholder-text-color);
            opacity: 1;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 5px var(--highlight);
        }

        textarea.auto-expand {
            overflow: hidden;
            resize: none;
            min-height: 60px;
            line-height: 1.4;
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Segment Manager */
        #segment-list {
            margin-top: 10px;
            border: 1px solid #044;
            padding: 10px;
            border-radius: 4px;
        }

        .segment-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        /* Tooltip style similar to screenshot icon */
        .help-icon {
            cursor: help;
            color: var(--highlight);
            margin-left: 5px;
            font-size: 0.9em;
        }

        /* Collapsible Notes */
        .notes-container {
            max-height: 1.2em;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            font-size: 0.75em;
            color: #aaa;
            margin-top: 4px;
            text-align: left;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .notes-container.expanded {
            max-height: 1000px; /* High enough to accommodate content */
            -webkit-line-clamp: unset;
            display: block;
        }
        .toggle-notes {
            color: var(--highlight);
            cursor: pointer;
            font-size: 0.7em;
            text-decoration: underline;
            display: inline-block;
            margin-top: 2px;
            user-select: none;
            white-space: nowrap;
        }

        /* SVG Buttons */
        .btn svg, .btn-svg svg, .product-name-cell svg {
            stroke: var(--button-svg-color);
        }
        
        .btn-svg {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--button-svg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .btn-svg:hover {
            transform: scale(1.2);
            color: #fff;
        }

        .notes-maximized-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3000;
            background-color: var(--bg-color);
            padding: 20px;
            flex-direction: column;
        }

        .notes-maximized-container.active {
            display: flex;
        }

        .notes-maximized-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .notes-maximized-header h2 {
            margin: 0;
            font-size: 1.5em;
            color: var(--highlight);
            text-align: left;
        }

        .notes-maximized-container textarea {
            flex-grow: 1;
            background-color: var(--input-bg-color);
            color: var(--input-text-color);
            border: 1px solid var(--highlight);
            padding: 20px;
            font-size: 1.1em;
            resize: none;
            outline: none;
            width: 100%;
            overflow-y: auto;
        }

        .notes-maximized-container textarea:focus {
            box-shadow: 0 0 15px var(--highlight);
        }

    </style>
</head>
<body style="margin: 0; padding: 0;">

    <div class="container">
        <h1>⚡ Voltage Drop Calculator</h1>

        <!-- Settings Accordion -->
        <div class="accordion-container">
            <div class="accordion-header" onclick="toggleAccordion()">
                <h3>Default Global Settings</h3>
                <span id="accordion-arrow">▲</span>
            </div>
            <div id="settings-content" class="accordion-content">
                <div class="import-export-container">
                    <button class="btn btn-edit" onclick="loadDefaultData()">Load Default Data</button>
                    <button class="btn btn-edit" onclick="exportData()">Export Data</button>
                    <button class="btn btn-edit" onclick="importData()">Import Data</button>
                    <input type="file" id="import-file" style="display:none" onchange="handleImport(event)">
                </div>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>Source Voltage (V)</label>
                        <input type="number" id="source-voltage" value="120" step="1" onchange="saveAndRender()">
                    </div>
                    <div class="setting-item">
                        <label>Outlet Amperage (A)</label>
                        <select id="outlet-amps" onchange="saveAndRender()">
                            <option value="15">15 Amps</option>
                            <option value="20">20 Amps</option>
                        </select>
                    </div>
                </div>

                <div class="visibility-split-container">
                    <!-- Cord Management -->
                    <div class="visibility-controls">
                        <span class="visibility-header">
                            Visible Cord Combos:
                            <button class="btn btn-add" style="padding: 2px 6px; font-size: 0.7em;" onclick="openCordModal()">+ Add</button>
                            <button class="btn btn-delete" style="padding: 2px 6px; font-size: 0.7em;" onclick="deleteAllCords()">Delete All</button>
                        </span>
                        <div id="cord-toggles" class="visibility-grid">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>

                    <!-- Product Management -->
                    <div class="visibility-controls">
                        <span class="visibility-header">
                            Visible Products:
                            <button class="btn btn-add" style="padding: 2px 6px; font-size: 0.7em;" onclick="openProductModal()">+ Add</button>
                            <button class="btn btn-delete" style="padding: 2px 6px; font-size: 0.7em;" onclick="deleteAllProducts()">Delete All</button>
                        </span>
                        <div id="product-toggles" class="visibility-grid">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Results Table -->
        <table id="results-table">
            <thead>
                <tr>
                    <th>Cord Combos</th>
                    <th>Electrical Product</th>
                    <th>Watts</th>
                    <th>Amps</th>
                    <th>Voltage Drop %</th>
                    <th>Safety Result</th>
                    <th>Total Load</th>
                    <th>Available Capacity</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('product-modal')">&times;</span>
            <h2 id="product-modal-title">Add Electrical Product</h2>
            <div class="modal-form-grid">
                <div class="form-group full-width">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" placeholder="e.g. Midea Duo 14k">
                </div>
                <div class="form-group">
                    <label>Amps (A)</label>
                    <input type="number" id="prod-amps" step="0.1" oninput="syncAmpsWatts('amps')">
                </div>
                <div class="form-group">
                    <label>Watts (W)</label>
                    <input type="number" id="prod-watts" step="1" oninput="syncAmpsWatts('watts')">
                </div>
                <div class="form-group full-width">
                    <label>Product URL</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="url" id="prod-url" style="flex-grow: 1;" placeholder="https://...">
                        <button class="btn" onclick="openUrlInNewTab()" title="Open link in new tab">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group full-width">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Notes</label>
                        <button class="btn-svg" id="btn-maximize-notes" onclick="toggleMaximizeNotes()" title="Maximize Notes">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                        </button>
                    </div>
                    <textarea id="prod-notes" class="auto-expand" placeholder="Enter product notes..." oninput="autoResize(this)"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-delete" id="btn-delete-product" style="display:none;" onclick="deleteProduct()">Delete</button>
                <button class="btn" onclick="closeModal('product-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Notes Maximized Overlay -->
    <div id="notes-maximized-overlay" class="notes-maximized-container">
        <div class="notes-maximized-header">
            <h2 id="notes-maximized-title">Field Name</h2>
            <button class="btn-svg" onclick="toggleMaximizeNotes()" title="Minimize Notes">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
        </div>
        <textarea id="notes-maximized-textarea" placeholder="Enter notes..."></textarea>
    </div>

    <!-- Cord Combo Modal -->
    <div id="cord-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('cord-modal')">&times;</span>
            <h2 id="cord-modal-title">Add Cord Combination</h2>
            <div class="modal-form-grid">
                <div class="form-group full-width">
                    <label>Cord Combo Name</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="cord-name" style="flex-grow: 1;" placeholder="e.g. Workshop Setup" oninput="handleNameInput()">
                        <button class="btn" id="btn-revert-name" onclick="revertToGeneratedName()" disabled title="Revert to generated name">↺ Auto</button>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Cord Segments</label>
                    <div id="segment-list">
                        <!-- Segments added here -->
                    </div>
                    <button class="btn" style="margin-top:10px;" onclick="addSegment()">+ Add Segment</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-delete" id="btn-delete-cord" style="display:none;" onclick="deleteCord()">Delete</button>
                <button class="btn" onclick="closeModal('cord-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveCord()">Save Combo</button>
            </div>
        </div>
    </div>

        function generateCordName() {
            const segElements = document.querySelectorAll('.segment-item');

                const awg = parseInt(el.querySelector('.seg-awg').value);
                if (!isNaN(length)) segments.push({ length, awg });
            });

            if (segments.length === 0) return "";

            // Sort by length descending
            segments.sort((a, b) => b.length - a.length);

            return segments.map(s => `${s.length} ft (${s.awg} AWG)`).join(' + ');
        }

        // Calculation Engine
        function calculateVoltageDrop(amps, segments) {
            const vSource = parseFloat(document.getElementById('source-voltage').value) || 120;
            let totalDropV = 0;
            let totalLength = 0;

            segments.forEach(seg => {
                const r = AWG_RESISTANCE[seg.awg];
                // Formula: Vdrop = (2 * L * R * I) / 1000
                const drop = (2 * seg.length * r * amps) / 1000;
                totalDropV += drop;
                totalLength += seg.length;
            });

            const dropPercent = (totalDropV / vSource) * 100;
            return {
                dropPercent: dropPercent.toFixed(1),
                totalDropV: totalDropV.toFixed(2),
                totalLength
            };
        }

        function getSafetyResult(percent) {
            const p = parseFloat(percent);
            if (p < 3.5) return { class: 'excellent', text: 'EXCELLENT (Very Safe)' };
            if (p < 4.8) return { class: 'safe', text: 'SAFE' };
            if (p < 5.0) return { class: 'safe', text: 'SAFE (Borderline)' };
            if (p === 5.0) return { class: 'safe', text: 'SAFE (Exact Legal Limit)' };
            if (p < 5.4) return { class: 'warning', text: 'WARNING (Fails 5% Rule)' };
            if (p < 5.7) return { class: 'warning', text: 'WARNING (Exceeds 5%)' };
            return { class: 'warning', text: 'WARNING (Do Not Recommend)' };
        }

        // Drag and Drop Handlers
        function handleDragStart(e, type, id) {
            draggedItem = { type, id };
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedItem = null;
        }

        function handleDragOver(e, type) {
            e.preventDefault();
            if (!draggedItem || draggedItem.type !== type) return;
            
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.visibility-item');
            if (target && !target.classList.contains('dragging')) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.visibility-item');
            if (target) {
                target.classList.remove('drag-over');
            }
        }

        function handleDrop(e, type, targetId) {
            e.preventDefault();
            const target = e.target.closest('.visibility-item');
            if (target) target.classList.remove('drag-over');

            if (!draggedItem || draggedItem.type !== type || draggedItem.id === targetId) return;

            const list = type === 'products' ? products : cordCombos;
            const fromIndex = list.findIndex(item => item.id === draggedItem.id);
            const toIndex = list.findIndex(item => item.id === targetId);

            if (fromIndex !== -1 && toIndex !== -1) {
                const [movedItem] = list.splice(fromIndex, 1);
                list.splice(toIndex, 0, movedItem);
                saveToStorage();
                renderAll();
            }
        }

        async function loadDefaultData(showConfirm = true) {
            if (showConfirm && !confirm('Load default data? This will overwrite your current settings, products and cord combos.')) {
                return;
            }

            try {
                const response = await fetch('defaults.json');
                const data = await response.json();
                if (data.products && data.cordCombos) {
                    products = data.products;
                    cordCombos = data.cordCombos;
                    if (data.sourceVoltage) document.getElementById('source-voltage').value = data.sourceVoltage;
                    if (data.outletAmperage) document.getElementById('outlet-amps').value = data.outletAmperage;
                    saveToStorage();
                    renderAll();
                    if (showConfirm) alert('Default data loaded successfully!');
                }
            } catch (error) {
                console.error('Error loading defaults.json:', error);
                if (showConfirm) alert('Error loading defaults.json. Please ensure the file exists and you are using a web server.');
            }
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.products && data.cordCombos) {
                        if (confirm('Import data? This will overwrite your current settings, products and cord combos.')) {
                            products = data.products;
                            cordCombos = data.cordCombos;
                            if (data.sourceVoltage) document.getElementById('source-voltage').value = data.sourceVoltage;
                            if (data.outletAmperage) document.getElementById('outlet-amps').value = data.outletAmperage;
                            saveToStorage();
                            renderAll();
                            alert('Data imported successfully!');
                        }
                    } else {
                        alert('Invalid data format.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        function renderTable() {
            const body = document.getElementById('results-body');
            body.innerHTML = '';
            
            const visibleProducts = products.filter(p => p.visible);
            const visibleCords = cordCombos.filter(c => c.visible);

            if (visibleProducts.length === 0 || visibleCords.length === 0) {
                body.innerHTML = `<tr><td colspan="8">No ${visibleProducts.length === 0 ? 'products' : 'cord combos'} enabled.</td></tr>`;
                return;
            }

            const vSource = parseFloat(document.getElementById('source-voltage').value) || 120;
            const outletLimitAmps = parseFloat(document.getElementById('outlet-amps').value) || 15;
            const outletLimitWatts = outletLimitAmps * vSource;

            const totalVisibleWatts = visibleProducts.reduce((sum, p) => sum + (p.watts || Math.round(p.amps * vSource)), 0);
            const totalVisibleAmps = visibleProducts.reduce((sum, p) => sum + p.amps, 0);

            const remainingAmps = outletLimitAmps - totalVisibleAmps;
            const remainingWatts = outletLimitWatts - totalVisibleWatts;
            const isOverloaded = remainingAmps < 0;

            visibleCords.forEach(cord => {
                visibleProducts.forEach((prod, index) => {
                    const row = document.createElement('tr');
                    const calc = calculateVoltageDrop(prod.amps, cord.segments);
                    const safety = getSafetyResult(calc.dropPercent);

                                <div>${totalVisibleWatts}W</div>
                                <div style="font-size:0.9em; color:#fff;">${totalVisibleAmps.toFixed(1)}A</div>
                                <div style="font-size:0.8em; color:var(--safety-warning); margin-top:4px;">-${totalCalc.totalDropV}V Drop</div>
                            </td>
                        `;
                        availableCell = `
                            <td rowspan="${visibleProducts.length}" style="font-weight:bold; color:${isOverloaded ? 'var(--safety-danger)' : 'var(--capacity-ok)'};">
                                <div>${remainingWatts.toFixed(0)}W</div>
                                <div style="font-size:0.9em;">${remainingAmps.toFixed(1)}A</div>
                                <div style="font-size:0.7em; margin-top:5px;">${isOverloaded ? 'OVERLOAD' : 'AVAILABLE'}</div>
                            </td>
                        `;
                    }

                    let notesHtml = "";
                    if (prod.notes) {
                        const notesId = `notes-${cord.id}-${prod.id}`;
                        notesHtml = `
                            <div class="notes-wrapper">
                                <div id="${notesId}" class="notes-container">${prod.notes}</div>
                                <span class="toggle-notes" onclick="toggleNotes('${notesId}', this)">more</span>
                            </div>
                        `;
                    }

                    let prodNameCell = `
                        ${prod.url ? `
                            <a href="${prod.url}" target="_blank" class="external-link-icon" title="Open link in new tab">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </a>
                        ` : ""}
                        <div style="text-align: left;">

                    `;

                    row.innerHTML = `
                        ${cordCell}
                        <td class="product-name-cell">${prodNameCell}</td>
                        <td>${prod.watts || Math.round(prod.amps * vSource)}W</td>
                        <td>${prod.amps}A</td>
                        <td class="${safety.class}">${calc.dropPercent}% Drop</td>
                        <td class="${safety.class}">${safety.text}</td>
                        ${totalLoadCell}
                        ${availableCell}
                    `;
                    body.appendChild(row);
                });
            });
        }

        function saveAndRender() {
            saveToStorage();
            renderTable();
        }

        function renderAll() {
            renderToggles();
            renderTable();
        }

        // Init
        document.getElementById('source-voltage').addEventListener('change', () => {
            saveAndRender();
        });

        // Close modal on backdrop click
        window.addEventListener('click', (event) => {
            if (event.target.classList.contains('modal')) {
                closeModal(event.target.id);
            }
        });

        // Close modal on Escape key
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                const overlay = document.getElementById('notes-maximized-overlay');
                if (overlay.classList.contains('active')) {
                    toggleMaximizeNotes();
                    return;
                }
                ['product-modal', 'cord-modal'].forEach(id => {
                    const modal = document.getElementById(id);
                    if (modal && modal.style.display === 'block') {
                        closeModal(id);
                    }
                });
            }
        });

        async function initializeApp() {
            const storedProducts = localStorage.getItem('vd_products');
            const storedCords = localStorage.getItem('vd_cords');
            const storedVoltage = localStorage.getItem('vd_source_voltage');
            const storedAmperage = localStorage.getItem('vd_outlet_amperage');

            if (storedProducts && storedCords) {
                products = JSON.parse(storedProducts);
                cordCombos = JSON.parse(storedCords);
                if (storedVoltage) document.getElementById('source-voltage').value = storedVoltage;
                if (storedAmperage) document.getElementById('outlet-amps').value = storedAmperage;
                renderAll();
            } else {
                await loadDefaultData(false);
            }
        }

        window.onload = initializeApp;

    </script>
</body>
</html>
