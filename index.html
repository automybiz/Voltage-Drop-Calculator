<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltage Drop Calculator</title>
    <style>
        :root {
            --bg-color: #011;
            --text-color: #fff;
            --table-border: #0ff;
            --input-bg: #111;
            --highlight: #0ff;
            
            /* Accordion Variables */
            --question-bg-color: #002222;
            --question-border-color: #009999;
            --question-hover-bg-color: #003333;
            --answer-bg-color: #050505;
            --border-radius: 8px;
            --accordion-spacing: 10px;
            --panel-bg-color: #303;
            --capacity-ok: #44FF44;
            --capacity-over: #FF4444;

            /* Safety Result Colors */
            --safety-excellent: #42A5F5;
            --safety-safe: #44FF44;
            --safety-warning: #FFA500;
            --safety-danger: #FF4444;
        }

        body {
            font-family: 'Segoe UI', "Arial Narrow", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: var(--highlight);
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1500px;
        }

        /* Accordion Styles */
        .accordion-container {
            margin-bottom: 20px;
            border: 1px solid var(--question-border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            width: 100%;
        }

        .accordion-header {
            background-color: var(--question-bg-color);
            color: #fff;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--question-border-color);
            transition: background-color 0.2s;
        }

        .accordion-header:hover {
            background-color: var(--question-hover-bg-color);
        }

        .accordion-header h3 {
            margin: 0;
            color: var(--highlight);
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .accordion-content {
            background-color: var(--panel-bg-color);
            padding: 15px;
            display: block; /* Shown by default based on screenshot */
        }

        .accordion-content.closed {
            display: none;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
        }

        .setting-item label {
            margin-bottom: 5px;
            color: var(--highlight);
            font-size: 0.9em;
            font-weight: bold;
        }

        /* Visibility Grid */
        .visibility-split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .visibility-controls {
            /* Now managed by parent split-container */
        }

        .visibility-header {
            color: var(--highlight);
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .visibility-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .visibility-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 0.9em;
        }

        .visibility-item span {
            cursor: pointer;
        }

        .visibility-item span:hover {
            color: var(--highlight);
        }

        .visibility-item input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: var(--highlight);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background-color: #004444;
            color: #fff;
            border: 1px solid var(--highlight);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #006666;
            box-shadow: 0 0 5px var(--highlight);
        }

        .btn-add { background-color: #005555; }
        .btn-edit { background-color: #003333; }
        .btn-delete { background-color: #440000; border-color: #f44; }
        .btn-delete:hover { background-color: #660000; box-shadow: 0 0 5px #f44; }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border: 1px solid var(--table-border);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        th, td {
            border-right: 1px solid #044;
            border-bottom: 1px solid #044;
            padding: 12px 8px;
            text-align: center;
        }

        th {
            background-color: #022;
            color: var(--highlight);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        td {
            background-color: #001111;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .cord-setup-cell {
            font-weight: bold;
            color: #fff;
        }

        .total-length {
            font-size: 0.85em;
            color: #888;
            display: block;
            margin-top: 4px;
        }

        /* Safety Classes */
        .excellent { color: var(--safety-excellent); font-weight: bold; }
        .safe { color: var(--safety-safe); font-weight: bold; }
        .warning { color: var(--safety-warning); font-weight: bold; }
        .danger { color: var(--safety-danger); font-weight: bold; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #002222;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--highlight);
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            position: relative;
        }

        .close-modal {
            color: #AAA;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close-modal:hover { color: #fff; }

        .modal-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .full-width { grid-column: span 2; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            color: var(--highlight);
            font-weight: bold;
            font-size: 0.9em;
        }

        input, select {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #066;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 5px var(--highlight);
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Segment Manager */
        #segment-list {
            margin-top: 10px;
            border: 1px solid #044;
            padding: 10px;
            border-radius: 4px;
        }

        .segment-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        /* Tooltip style similar to screenshot icon */
        .help-icon {
            cursor: help;
            color: var(--highlight);
            margin-left: 5px;
            font-size: 0.9em;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Voltage Drop Calculator</h1>

        <!-- Settings Accordion -->
        <div class="accordion-container">
            <div class="accordion-header" onclick="toggleAccordion()">
                <h3>Default Global Settings</h3>
                <span id="accordion-arrow">▲</span>
            </div>
            <div id="settings-content" class="accordion-content">
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>Source Voltage (V)</label>
                        <input type="number" id="source-voltage" value="120" step="1" onchange="renderTable()">
                    </div>
                    <div class="setting-item">
                        <label>Outlet Amperage (A)</label>
                        <select id="outlet-amps" onchange="renderTable()">
                            <option value="15">15 Amps</option>
                            <option value="20">20 Amps</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-add" onclick="openProductModal()">+ Add New Product</button>
                    <button class="btn btn-add" onclick="openCordModal()">+ Add New Cord Combo</button>
                </div>

                <div class="visibility-split-container">
                    <!-- Cord Management -->
                    <div class="visibility-controls">
                        <span class="visibility-header">Visible Cord Combos:</span>
                        <div id="cord-toggles" class="visibility-grid">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>

                    <!-- Product Management -->
                    <div class="visibility-controls">
                        <span class="visibility-header">Visible Products:</span>
                        <div id="product-toggles" class="visibility-grid">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Results Table -->
        <table id="results-table">
            <thead>
                <tr>
                    <th>Cord Combos</th>
                    <th>Electrical Product</th>
                    <th>Watts</th>
                    <th>Amps</th>
                    <th>Voltage Drop %</th>
                    <th>Safety Result</th>
                    <th>Total Load</th>
                    <th>Available Capacity</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('product-modal')">&times;</span>
            <h2 id="product-modal-title">Add Electrical Product</h2>
            <div class="modal-form-grid">
                <div class="form-group full-width">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" placeholder="e.g. Midea Duo 14k">
                </div>
                <div class="form-group">
                    <label>Amps (A)</label>
                    <input type="number" id="prod-amps" step="0.1" oninput="syncAmpsWatts('amps')">
                </div>
                <div class="form-group">
                    <label>Watts (W)</label>
                    <input type="number" id="prod-watts" step="1" oninput="syncAmpsWatts('watts')">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-delete" id="btn-delete-product" style="display:none;" onclick="deleteProduct()">Delete</button>
                <button class="btn" onclick="closeModal('product-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Cord Combo Modal -->
    <div id="cord-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('cord-modal')">&times;</span>
            <h2 id="cord-modal-title">Add Cord Combination</h2>
            <div class="modal-form-grid">
                <div class="form-group full-width">
                    <label>Cord Combo Name</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="cord-name" style="flex-grow: 1;" placeholder="e.g. Workshop Setup" oninput="handleNameInput()">
                        <button class="btn" id="btn-revert-name" onclick="revertToGeneratedName()" disabled title="Revert to generated name">↺ Auto</button>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Cord Segments</label>
                    <div id="segment-list">
                        <!-- Segments added here -->
                    </div>
                    <button class="btn" style="margin-top:10px;" onclick="addSegment()">+ Add Segment</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-delete" id="btn-delete-cord" style="display:none;" onclick="deleteCord()">Delete</button>
                <button class="btn" onclick="closeModal('cord-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveCord()">Save Combo</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let products = JSON.parse(localStorage.getItem('vd_products')) || [
            { id: 1, name: 'Insignia (~6k)', amps: 10, watts: 1200, visible: true },
            { id: 2, name: 'Midea Duo 12,000', amps: 10.4, watts: 1248, visible: true },
            { id: 3, name: 'Midea Duo 14,000', amps: 11.3, watts: 1356, visible: true }
        ];

        let cordCombos = JSON.parse(localStorage.getItem('vd_cords')) || [
            { id: 1, name: '200 ft (10 AWG)', segments: [{ length: 200, awg: 10 }], visible: true },
            { id: 2, name: '200 ft (10 AWG) + 25 ft (12 AWG)', segments: [{ length: 200, awg: 10 }, { length: 25, awg: 12 }], visible: true },
            { id: 3, name: '200 ft (10 AWG) + 25 ft (10 AWG)', segments: [{ length: 200, awg: 10 }, { length: 25, awg: 10 }], visible: true }
        ];

        let editingId = null;

        // Resistance per 1000ft (Copper at 75C approx)
        const AWG_RESISTANCE = {
            10: 1.24,
            12: 1.98,
            14: 3.14,
            16: 4.99,
            18: 7.95
        };

        function saveToStorage() {
            localStorage.setItem('vd_products', JSON.stringify(products));
            localStorage.setItem('vd_cords', JSON.stringify(cordCombos));
        }

        // UI Handlers
        function toggleAccordion() {
            const content = document.getElementById('settings-content');
            const arrow = document.getElementById('accordion-arrow');
            content.classList.toggle('closed');
            arrow.innerText = content.classList.contains('closed') ? '▼' : '▲';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            editingId = null;
        }

        function openProductModal(id = null) {
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('product-modal-title');
            const deleteBtn = document.getElementById('btn-delete-product');
            
            if (id) {
                const p = products.find(x => x.id === id);
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-amps').value = p.amps;
                syncAmpsWatts('amps');
                title.innerText = 'Edit Product';
                deleteBtn.style.display = 'block';
                editingId = id;
            } else {
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-amps').value = '';
                document.getElementById('prod-watts').value = '';
                title.innerText = 'Add Electrical Product';
                deleteBtn.style.display = 'none';
            }
            modal.style.display = 'block';
        }

        function openCordModal(id = null) {
            const modal = document.getElementById('cord-modal');
            const title = document.getElementById('cord-modal-title');
            const deleteBtn = document.getElementById('btn-delete-cord');
            const list = document.getElementById('segment-list');
            list.innerHTML = '';

            if (id) {
                const c = cordCombos.find(x => x.id === id);
                document.getElementById('cord-name').value = c.name;
                c.segments.forEach(seg => addSegment(seg.length, seg.awg));
                title.innerText = 'Edit Cord Combo';
                deleteBtn.style.display = 'block';
                editingId = id;
            } else {
                document.getElementById('cord-name').value = '';
                addSegment(50, 12);
                title.innerText = 'Add Cord Combination';
                deleteBtn.style.display = 'none';
            }
            document.getElementById('btn-revert-name').disabled = true;
            modal.style.display = 'block';
        }

        function generateCordName() {
            const segElements = document.querySelectorAll('.segment-item');
            const segments = [];
            segElements.forEach(el => {
                const length = parseFloat(el.querySelector('.seg-len').value);
                const awg = parseInt(el.querySelector('.seg-awg').value);
                if (!isNaN(length)) segments.push({ length, awg });
            });

            if (segments.length === 0) return "";

            // Sort by length descending
            segments.sort((a, b) => b.length - a.length);

            return segments.map(s => `${s.length} ft (${s.awg} AWG)`).join(' + ');
        }

        function handleNameInput() {
            const input = document.getElementById('cord-name');
            const generated = generateCordName();
            const btn = document.getElementById('btn-revert-name');
            
            // Enable button only if user entered something different from generated
            btn.disabled = (input.value === generated || input.value.trim() === "");
        }

        function revertToGeneratedName() {
            const input = document.getElementById('cord-name');
            input.value = generateCordName();
            document.getElementById('btn-revert-name').disabled = true;
        }

        function updateCordNameUI() {
            const input = document.getElementById('cord-name');
            if (input.value === "" || document.getElementById('btn-revert-name').disabled) {
                const generated = generateCordName();
                if (generated) {
                    input.value = generated;
                    document.getElementById('btn-revert-name').disabled = true;
                }
            }
        }

        function addSegment(len = '', gauge = 12) {
            const list = document.getElementById('segment-list');
            const div = document.createElement('div');
            div.className = 'segment-item';
            div.innerHTML = `
                <div class="form-group">
                    <label>Length (ft)</label>
                    <input type="number" class="seg-len" value="${len}" placeholder="Feet" oninput="updateCordNameUI()">
                </div>
                <div class="form-group">
                    <label>AWG</label>
                    <select class="seg-awg" onchange="updateCordNameUI()">
                        <option value="10" ${gauge == 10 ? 'selected' : ''}>10 AWG</option>
                        <option value="12" ${gauge == 12 ? 'selected' : ''}>12 AWG</option>
                        <option value="14" ${gauge == 14 ? 'selected' : ''}>14 AWG</option>
                        <option value="16" ${gauge == 16 ? 'selected' : ''}>16 AWG</option>
                    </select>
                </div>
                <button class="btn btn-delete" onclick="this.parentElement.remove(); updateCordNameUI();">X</button>
            `;
            list.appendChild(div);
        }

        function syncAmpsWatts(source) {
            const v = parseFloat(document.getElementById('source-voltage').value) || 120;
            const ampsInput = document.getElementById('prod-amps');
            const wattsInput = document.getElementById('prod-watts');

            if (source === 'amps') {
                const a = parseFloat(ampsInput.value);
                if (!isNaN(a)) wattsInput.value = Math.round(a * v);
            } else {
                const w = parseFloat(wattsInput.value);
                if (!isNaN(w)) ampsInput.value = (w / v).toFixed(2);
            }
        }

        function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const amps = parseFloat(document.getElementById('prod-amps').value);
            const watts = parseInt(document.getElementById('prod-watts').value);
            
            if (!name || isNaN(amps)) return alert('Please fill in all fields');

            if (editingId) {
                const p = products.find(x => x.id === editingId);
                p.name = name;
                p.amps = amps;
                p.watts = watts;
            } else {
                products.push({ id: Date.now(), name, amps, watts, visible: true });
            }
            
            saveToStorage();
            closeModal('product-modal');
            renderAll();
        }

        function saveCord() {
            const name = document.getElementById('cord-name').value;
            const segElements = document.querySelectorAll('.segment-item');
            const segments = [];
            
            segElements.forEach(el => {
                const length = parseFloat(el.querySelector('.seg-len').value);
                const awg = parseInt(el.querySelector('.seg-awg').value);
                if (!isNaN(length)) segments.push({ length, awg });
            });

            if (!name || segments.length === 0) return alert('Please fill in all fields');

            if (editingId) {
                const c = cordCombos.find(x => x.id === editingId);
                c.name = name;
                c.segments = segments;
            } else {
                cordCombos.push({ id: Date.now(), name, segments, visible: true });
            }

            saveToStorage();
            closeModal('cord-modal');
            renderAll();
        }

        function deleteProduct() {
            if (confirm('Delete this product?')) {
                products = products.filter(x => x.id !== editingId);
                saveToStorage();
                closeModal('product-modal');
                renderAll();
            }
        }

        function deleteCord() {
            if (confirm('Delete this cord combo?')) {
                cordCombos = cordCombos.filter(x => x.id !== editingId);
                saveToStorage();
                closeModal('cord-modal');
                renderAll();
            }
        }

        function toggleProductVisibility(id) {
            const p = products.find(x => x.id === id);
            p.visible = !p.visible;
            saveToStorage();
            renderTable();
        }

        function toggleCordVisibility(id) {
            const c = cordCombos.find(x => x.id === id);
            c.visible = !c.visible;
            saveToStorage();
            renderTable();
        }

        // Calculation Engine
        function calculateVoltageDrop(amps, segments) {
            const vSource = parseFloat(document.getElementById('source-voltage').value) || 120;
            let totalDropV = 0;
            let totalLength = 0;

            segments.forEach(seg => {
                const r = AWG_RESISTANCE[seg.awg];
                // Formula: Vdrop = (2 * L * R * I) / 1000
                const drop = (2 * seg.length * r * amps) / 1000;
                totalDropV += drop;
                totalLength += seg.length;
            });

            const dropPercent = (totalDropV / vSource) * 100;
            return {
                dropPercent: dropPercent.toFixed(1),
                totalDropV: totalDropV.toFixed(2),
                totalLength
            };
        }

        function getSafetyResult(percent) {
            const p = parseFloat(percent);
            if (p < 3.5) return { class: 'excellent', text: 'EXCELLENT (Very Safe)' };
            if (p < 4.8) return { class: 'safe', text: 'SAFE' };
            if (p < 5.0) return { class: 'safe', text: 'SAFE (Borderline)' };
            if (p === 5.0) return { class: 'safe', text: 'SAFE (Exact Legal Limit)' };
            if (p < 5.4) return { class: 'warning', text: 'WARNING (Fails 5% Rule)' };
            if (p < 5.7) return { class: 'warning', text: 'WARNING (Exceeds 5%)' };
            return { class: 'warning', text: 'WARNING (Do Not Recommend)' };
        }

        // Rendering
        function renderToggles() {
            const prodContainer = document.getElementById('product-toggles');
            prodContainer.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'visibility-item';
                div.innerHTML = `
                    <input type="checkbox" id="chk-p-${p.id}" ${p.visible ? 'checked' : ''} onchange="toggleProductVisibility(${p.id})">
                    <label for="chk-p-${p.id}">${p.name}</label>
                    <button class="btn btn-edit" style="padding: 2px 6px; font-size: 0.7em;" onclick="openProductModal(${p.id})">Edit</button>
                `;
                prodContainer.appendChild(div);
            });

            const cordContainer = document.getElementById('cord-toggles');
            cordContainer.innerHTML = '';
            cordCombos.forEach(c => {
                const div = document.createElement('div');
                div.className = 'visibility-item';
                div.innerHTML = `
                    <input type="checkbox" id="chk-c-${c.id}" ${c.visible ? 'checked' : ''} onchange="toggleCordVisibility(${c.id})">
                    <label for="chk-c-${c.id}">${c.name}</label>
                    <button class="btn btn-edit" style="padding: 2px 6px; font-size: 0.7em;" onclick="openCordModal(${c.id})">Edit</button>
                `;
                cordContainer.appendChild(div);
            });
        }

        function renderTable() {
            const body = document.getElementById('results-body');
            body.innerHTML = '';
            
            const visibleProducts = products.filter(p => p.visible);
            const visibleCords = cordCombos.filter(c => c.visible);

            if (visibleProducts.length === 0 || visibleCords.length === 0) {
                body.innerHTML = `<tr><td colspan="8">No ${visibleProducts.length === 0 ? 'products' : 'cord combos'} enabled.</td></tr>`;
                return;
            }

            const vSource = parseFloat(document.getElementById('source-voltage').value) || 120;
            const outletLimitAmps = parseFloat(document.getElementById('outlet-amps').value) || 15;
            const outletLimitWatts = outletLimitAmps * vSource;

            const totalVisibleWatts = visibleProducts.reduce((sum, p) => sum + (p.watts || Math.round(p.amps * vSource)), 0);
            const totalVisibleAmps = visibleProducts.reduce((sum, p) => sum + p.amps, 0);

            const remainingAmps = outletLimitAmps - totalVisibleAmps;
            const remainingWatts = outletLimitWatts - totalVisibleWatts;
            const isOverloaded = remainingAmps < 0;

            visibleCords.forEach(cord => {
                visibleProducts.forEach((prod, index) => {
                    const row = document.createElement('tr');
                    const calc = calculateVoltageDrop(prod.amps, cord.segments);
                    const safety = getSafetyResult(calc.dropPercent);

                    let cordCell = '';
                    let totalLoadCell = '';
                    let availableCell = '';
                    if (index === 0) {
                        const totalCalc = calculateVoltageDrop(totalVisibleAmps, cord.segments);
                        cordCell = `
                            <td rowspan="${visibleProducts.length}" class="cord-setup-cell" onclick="openCordModal(${cord.id})" style="cursor:pointer; border-right: 1px solid #044;">
                                <div>${cord.name}</div>
                                <span class="total-length">Total Length: ${calc.totalLength} ft</span>
                                <div style="font-size:0.7em; color:var(--highlight); margin-top:5px;">[ Click to Edit ]</div>
                            </td>
                        `;
                        totalLoadCell = `
                            <td rowspan="${visibleProducts.length}" style="font-weight:bold; color:var(--highlight); border-right: 1px solid #044;">
                                <div>${totalVisibleWatts} W</div>
                                <div style="font-size:0.9em; color:#fff;">${totalVisibleAmps.toFixed(1)} A</div>
                                <div style="font-size:0.8em; color:var(--safety-warning); margin-top:4px;">-${totalCalc.totalDropV}V Drop</div>
                            </td>
                        `;
                        availableCell = `
                            <td rowspan="${visibleProducts.length}" style="font-weight:bold; color:${isOverloaded ? 'var(--safety-danger)' : 'var(--capacity-ok)'};">
                                <div>${remainingWatts.toFixed(0)} W</div>
                                <div style="font-size:0.9em;">${remainingAmps.toFixed(1)} A</div>
                                <div style="font-size:0.7em; margin-top:5px;">${isOverloaded ? 'OVERLOAD' : 'AVAILABLE'}</div>
                            </td>
                        `;
                    }

                    row.innerHTML = `
                        ${cordCell}
                        <td>${prod.name}</td>
                        <td>${prod.watts || Math.round(prod.amps * vSource)} W</td>
                        <td>${prod.amps} Amps</td>
                        <td class="${safety.class}">${calc.dropPercent}% Drop</td>
                        <td class="${safety.class}">${safety.text}</td>
                        ${totalLoadCell}
                        ${availableCell}
                    `;
                    body.appendChild(row);
                });
            });
        }

        function renderAll() {
            renderToggles();
            renderTable();
        }

        // Init
        document.getElementById('source-voltage').addEventListener('change', () => {
            renderTable();
        });

        window.onload = renderAll;

    </script>
</body>
</html>
